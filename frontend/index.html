  <link rel="canonical" href="https://renex.id/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="RENEX" />
  <meta property="og:title" content="RENEX — For Humans. By Humans." />
  <meta property="og:description" content="The passkey-only, human-first messenger. No phone number, no email, no password — and no bots. End-to-end encrypted." />

  <meta property="og:image" content="https://renex.id/icons/icon-512.png" />

  <meta property="og:image:height" content="512" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="RENEX — For Humans. By Humans." />
