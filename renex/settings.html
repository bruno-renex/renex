<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>RENEX – Einstellungen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/colors.css" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .settings-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-panel);
      background: var(--bg-panel);
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 15px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .back-btn:hover { background: var(--bg-hover); }

    h1 {
      font-size: 17px;
      font-weight: 600;
      margin: 0;
    }

    .settings-body {
      max-width: 520px;
      margin: 32px auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .settings-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin: 20px 0 6px 4px;
    }

    .settings-card {
      background: var(--bg-panel);
      border-radius: 12px;
      border: 1px solid var(--border-panel);
      overflow: hidden;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-panel);
      gap: 16px;
    }
    .settings-row:last-child { border-bottom: none; }

    .settings-row-label {
      font-size: 14px;
      font-weight: 500;
    }
    .settings-row-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .settings-row-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    select {
      background: var(--bg-input, var(--bg-main));
      color: var(--text-primary);
      border: 1px solid var(--border-panel);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    select:focus { border-color: var(--accent); }

    .save-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .save-toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="settings-header">
  <button class="back-btn" onclick="history.back()">← Zurück</button>
  <h1 data-i18n="settings">Einstellungen</h1>
</div>

<div class="settings-body">

  <!-- SPRACHE -->
  <div class="settings-section-title" data-i18n="langToggleLabel">Sprache</div>
  <div class="settings-card">
    <div class="settings-row">
      <div>
        <div class="settings-row-label">🌍 <span data-i18n="langToggleLabel">Sprache</span></div>
        <div class="settings-row-sub">Interface-Sprache</div>
      </div>
      <div class="settings-row-right">
        <select id="lang-select">
          <option value="de">DE – Deutsch</option>
          <option value="en">EN – English</option>
        </select>
      </div>
    </div>
  </div>

  <!-- DATENSCHUTZ -->
  <div class="settings-section-title">Datenschutz</div>
  <div class="settings-card">
    <div class="settings-row">
      <div>
        <div class="settings-row-label">🗑️ Auto-Delete (Global)</div>
        <div class="settings-row-sub">Löscht alle deine Nachrichten nach N Tagen</div>
      </div>
      <div class="settings-row-right">
        <select id="auto-delete-select">
          <option value="">Nie</option>
          <option value="1">1 Tag</option>
          <option value="7">7 Tage</option>
          <option value="30">30 Tage</option>
          <option value="90">90 Tage</option>
          <option value="365">1 Jahr</option>
        </select>
      </div>
    </div>
  </div>

</div>

<div class="save-toast" id="save-toast">✓ Gespeichert</div>

<script type="module" src="/js/settings.js"></script>
<script type="module">
  import { applyI18n } from "./js/i18n.js";
  applyI18n();
</script>

</body>
</html>
