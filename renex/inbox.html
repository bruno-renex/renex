<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>RENEX – Inbox</title>
  <!-- i18n: Seitentitel wird per JS gesetzt -->

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/colors.css" />

<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 24px;
  }

  /* ============================= */
  /* HEADER */
  /* ============================= */

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }

  .brand {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-primary);
    user-select: none;
  }

  .brand .x {
    color: var(--accent-voice);
    text-shadow:
      0 0 10px rgba(56, 189, 248, 0.7),
      0 0 22px rgba(56, 189, 248, 0.35);
  }

  /* ============================= */
  /* CHAT LINK */
  /* ============================= */

  a.chat-link {
    color: var(--accent-voice);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: opacity 0.15s ease;
  }

  a.chat-link:hover {
    opacity: 0.75;
  }

  .profile-wrapper {
    position: relative;
  }

  #profile-circle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--bg-panel);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  #profile-circle:hover {
    transform: scale(1.05);
    opacity: 0.9;
  }

  .dropdown {
    position: absolute;
    top: 48px;
    right: 0;
    background: var(--bg-panel);
    border: 1px solid var(--border-panel);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    min-width: 160px;
    padding: 8px 0;
    display: none;
    z-index: 100;
  }

  .dropdown.show {
    display: block;
  }

  .dropdown-item {
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
  }

  .dropdown-item:hover {
    background: var(--bg-panel-alt);
  }

  .dropdown-divider {
    height: 1px;
    background: var(--border-subtle);
    margin: 6px 0;
  }

  .logout {
    color: var(--status-error);
  }

  /* Sub-Dropdown (zweite Ebene) */
  .dropdown-item.has-sub {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .dropdown-item.has-sub::after {
    content: "›";
    font-size: 16px;
    opacity: 0.5;
    margin-left: 8px;
  }

  #account-submenu {
    position: absolute;
    top: 0;
    right: calc(100% + 6px);
    background: var(--bg-panel);
    border: 1px solid var(--border-panel);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    min-width: 160px;
    padding: 8px 0;
    display: none;
    z-index: 101;
  }

  #account-submenu.show {
    display: block;
  }

  /* Bestätigungsdialog */
  #delete-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  #delete-overlay.show {
    display: flex;
  }

  #delete-dialog {
    background: var(--bg-panel);
    border: 1px solid var(--border-panel);
    border-radius: 14px;
    padding: 28px 24px;
    width: 320px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  }

  #delete-dialog h3 {
    margin: 0 0 10px 0;
    font-size: 17px;
    color: var(--text-primary);
  }

  #delete-dialog p {
    margin: 0 0 20px 0;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  #delete-dialog input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    font-size: 14px;
    background: var(--bg-input, var(--bg-panel-alt));
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  #delete-handle-error {
    font-size: 12px;
    color: var(--status-error);
    min-height: 18px;
    margin-bottom: 16px;
  }

  .dialog-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .dialog-actions button {
    padding: 9px 18px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    cursor: pointer;
    margin: 0;
  }

  #btn-cancel-delete {
    background: var(--bg-panel-alt);
    color: var(--text-primary);
  }

  #btn-confirm-delete {
    background: var(--status-error);
    color: #fff;
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.15s;
  }

  #btn-confirm-delete.enabled {
    opacity: 1;
    pointer-events: auto;
  }

  /* ============================= */
  /* TABS */
  /* ============================= */

  .tab-bar {
    display: flex;
    gap: 0;
    background: transparent;
    border-bottom: 2px solid var(--border-subtle);
    padding: 0;
    margin-bottom: 20px;
  }

  .tab-btn {
    flex: 1;
    padding: 10px 0 9px;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    border-radius: 0;
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    position: relative;
  }

  .tab-btn:hover {
    color: var(--text-primary);
    background: transparent;
  }

  .tab-btn.active {
    color: var(--accent-voice);
    font-weight: 700;
    border-bottom-color: var(--accent-voice);
    background: transparent;
  }

  .tab-badge {
    background: var(--status-error);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    border-radius: 999px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .tab-badge.visible {
    display: flex;
  }

  .tab-panel {
    display: none;
  }

  .tab-panel.active {
    display: block;
  }

  /* ============================= */
  /* CONTENT */
  /* ============================= */

  h2 {
    margin-top: 24px;
    margin-bottom: 12px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  ul {
    list-style: none;
    padding: 0;
  }

  li {
    margin: 6px 0;
  }

  button {
    margin-left: 8px;
  }

  #add-btn, #create-group-btn {
    margin-left: 0;
  }

  #add-btn:hover {
    opacity: 0.85;
    transform: scale(1.08);
  }

  #create-group-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 24px rgba(0,0,0,0.45);
  }
  #create-group-btn:active {
    transform: scale(0.96);
  }

  #add-handle {
    margin-right: 8px;
  }
</style>
</head>

<body>

<div class="header">
  <div class="brand">RENE<span class="x">X</span></div>

  <div class="profile-wrapper">
    <div id="profile-circle"></div>

    <div id="profile-dropdown" class="dropdown">
      <div id="dropdown-handle" class="dropdown-item has-sub">
        <span id="dropdown-handle-label"></span>
        <div id="account-submenu" class="dropdown">
          <div id="dropdown-delete" class="dropdown-item logout" data-i18n="deleteAccount">Account löschen</div>
        </div>
      </div>
      <div class="dropdown-divider"></div>
      <div id="dropdown-lang" class="dropdown-item has-sub">
        <span data-i18n="langToggleLabel">Sprache</span>
        <div id="lang-submenu" class="dropdown" style="top:0;right:calc(100% + 6px);position:absolute;background:var(--bg-panel);border:1px solid var(--border-panel);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.4);min-width:100px;padding:8px 0;display:none;z-index:102;">
          <div id="lang-opt-de" class="dropdown-item">🇩🇪 DE – Deutsch</div>
          <div id="lang-opt-en" class="dropdown-item">🇬🇧 EN – English</div>
          <div id="lang-opt-es" class="dropdown-item">🇪🇸 ES – Español</div>
        </div>
      </div>
      <div class="dropdown-divider"></div>
      <div id="dropdown-logout" class="dropdown-item logout" data-i18n="logout">
        Logout
      </div>
    </div>
  </div>
</div>

  <!-- TAB BAR -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="chats">
      💬 <span data-i18n="tabChats">Chats</span>
      <span id="tab-badge-chats" class="tab-badge"></span>
    </button>
    <button class="tab-btn" data-tab="groups">
      👥 <span data-i18n="tabGroups">Groups</span>
      <span id="tab-badge-groups" class="tab-badge"></span>
    </button>
    <button class="tab-btn" data-tab="contacts">
      👤 <span data-i18n="tabContacts">Contacts</span>
      <span id="tab-badge-contacts" class="tab-badge"></span>
    </button>
  </nav>

  <!-- TAB 1: CHATS (DMs) -->
  <div class="tab-panel active" id="panel-chats">
    <ul id="accepted"></ul>
  </div>

  <!-- TAB 2: GRUPPEN -->
  <div class="tab-panel" id="panel-groups">
    <ul id="groups"></ul>
    <!-- FAB: Gruppe erstellen -->
    <button id="create-group-btn" data-i18n-title="createGroupBtn" title="Gruppe erstellen"
      style="position:fixed;bottom:28px;right:28px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;border:none;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,0.35);display:none;align-items:center;justify-content:center;transition:transform 0.15s,box-shadow 0.15s;z-index:200;line-height:1;">＋</button>
    <!-- FAB Popup -->
    <div id="create-group-popup" style="display:none;position:fixed;bottom:90px;right:28px;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,0.4);padding:12px;z-index:201;width:230px;">
      <input id="group-name-input" type="text" data-i18n-placeholder="groupNamePlaceholder" placeholder="Gruppenname" autocomplete="off" autocorrect="off" autocapitalize="off"
        style="width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-panel-alt);color:var(--text-primary);font-size:14px;outline:none;" />
    </div>
  </div>

  <!-- TAB 3: KONTAKTE -->
  <div class="tab-panel" id="panel-contacts">
    <h2 data-i18n="addContactHeading">Kontakt hinzufügen</h2>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <input id="add-handle" type="search" placeholder="Handle (z. B. bob)"
        data-i18n-placeholder="addContactPlaceholder" autocomplete="off"
        autocorrect="off" autocapitalize="off" spellcheck="false" name="renex-contact"
        style="margin:0;flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-panel-alt);color:var(--text-primary);font-size:14px;-webkit-appearance:none;" />
      <button id="add-btn" data-i18n-title="addContactBtn" title="Anfrage senden"
        style="margin-left:0;width:42px;height:42px;min-width:42px;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.15s,opacity 0.15s;flex-shrink:0;">＋</button>
    </div>
    <h2 data-i18n="pendingHeading">Offene Anfragen</h2>
    <ul id="pending"></ul>
  </div>

<!-- Bestätigungsdialog Account löschen -->
<div id="delete-overlay">
  <div id="delete-dialog">
    <h3 data-i18n="deleteAccountDialogTitle">Account löschen</h3>
    <p data-i18n-html="deleteAccountDialogBody">Diese Aktion ist unwiderruflich. Alle Nachrichten und Kontakte werden gelöscht.<br><br>Gib deinen Handle zur Bestätigung ein:</p>
    <input id="delete-confirm-input" type="text" placeholder="Dein Handle" data-i18n-placeholder="deleteAccountPlaceholder" autocomplete="off" />
    <div id="delete-handle-error"></div>
    <div class="dialog-actions">
      <button id="btn-cancel-delete" data-i18n="cancelBtn">Abbrechen</button>
      <button id="btn-confirm-delete" data-i18n="deleteAccountConfirmBtn">Account löschen</button>
    </div>
  </div>
</div>

  <!-- 🔥 WICHTIG: Script GANZ UNTEN + type="module" -->
<script type="module" src="/js/inbox.js"></script>
<script type="module">
  import { bootApp } from "./js/appBoot.js";
  import { applyI18n } from "./js/i18n.js";
  applyI18n();
  bootApp();
</script>

</body>
</html>
