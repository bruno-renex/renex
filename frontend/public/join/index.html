<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#38bdf8" />
  <link rel="manifest" href="/manifest.json" />
  <title>RENEX – Invitation</title>
  <link rel="stylesheet" href="/colors.css" />
  <!-- WICHTIG: Turnstile-Callback MUSS vor dem Turnstile-Script-Load
       synchron global verfügbar sein. Sonst geht der Callback verloren
       wenn Turnstile fertig ist bevor Module-Scripts laufen (deferred). -->
  <script>
    // Token-Holder der vom Modul-Script später gelesen wird
    window.__cfToken    = null;
    window.__consentOk  = false;
    // Terms Version (synchron mit AGB/Datenschutz-Gültigkeitsdatum)
    window.TERMS_VERSION = "2026-04-15";

    // Zentrale Button-Enable-Logik: Turnstile UND Consent müssen erfüllt sein
    window.__updateJoinBtn = function() {
      var btn = document.getElementById("joinBtn");
      if (!btn) return;
      btn.disabled = !(window.__cfToken && window.__consentOk);
    };

    window.onTurnstileSolved = function(t) {
      window.__cfToken = t;
      window.__updateJoinBtn();
    };
    window.onTurnstileExpired = function() {
      window.__cfToken = null;
      window.__updateJoinBtn();
    };
    window.onTurnstileError = function() {
      window.__cfToken = null;
      window.__updateJoinBtn();
    };
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-body, #07070A);
      color: var(--text-primary, #E6E6EB);
      min-height: 100vh;   /* Fallback für alte Browser */
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--bg-panel, #0D0D11);
      border: 1px solid var(--border-panel, rgba(255,255,255,0.06));
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-primary, #E6E6EB);
    }
    .logo .x { color: var(--accent-voice, #38BDF8); }

    /* Shield-Icon in Accent-Farbe statt Emoji */
    .invite-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .invite-icon svg {
      width: 44px;
      height: 44px;
      color: var(--accent-voice, #38BDF8);
      filter: drop-shadow(0 0 10px var(--accent-voice-glow, rgba(56,189,248,0.35)));
    }

    .invite-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary, #E6E6EB);
    }

    .invite-sub {
      font-size: 13px;
      color: var(--text-secondary, #9A9AA3);
      line-height: 1.5;
    }

    /* Info-Rows: linke Accent-Linie statt Box */
    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 2px solid var(--accent-voice, #38BDF8);
      padding: 8px 0 8px 14px;
      font-size: 13px;
      color: var(--text-secondary, #9A9AA3);
      text-align: left;
    }
    .info-row span { flex: 1; }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, box-shadow 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Primary Button mit Glow wie Chat-Bubbles */
    .btn-primary {
      background: var(--accent-voice, #38BDF8);
      color: #07070A;
      box-shadow: 0 0 16px var(--accent-voice-glow, rgba(56,189,248,0.35));
    }
    .btn-primary:hover {
      box-shadow: 0 0 24px var(--accent-voice-glow, rgba(56,189,248,0.45));
    }

    /* ── Consent Checkbox ──────────────────── */
    .join-consent {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary, #9A9AA3);
      line-height: 1.5;
      padding: 4px 2px;
      cursor: pointer;
      user-select: none;
      text-align: left;
    }
    .join-consent input[type="checkbox"] {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      margin-top: 2px;
      accent-color: var(--accent-voice, #38BDF8);
      cursor: pointer;
    }
    .join-consent a {
      color: var(--accent-voice, #38BDF8);
      text-decoration: none;
    }
    .join-consent a:hover { text-decoration: underline; }

    /* Ghost-Button: reiner Text-Link, kein Border */
    .btn-ghost {
      background: transparent;
      border: none;
      color: var(--text-muted, #6F6F78);
      font-size: 13px;
      padding: 8px;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--border-subtle, #1C1C24);
    }
    .btn-ghost:hover {
      color: var(--text-secondary, #9A9AA3);
      opacity: 1;
    }

    .status {
      font-size: 13px;
      color: var(--text-secondary, #9A9AA3);
      min-height: 18px;
    }
    .status.error { color: var(--status-error, #F87171); }
    .status.ok    { color: var(--status-speaking, #3CE47A); }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      border: none;
      border-top: 1px solid var(--border-subtle, #1C1C24);
    }

    #errorCard { display: none; }
  </style>
</head>
<body>

<!-- LADE-STATE -->
<div class="card" id="loadingCard">
  <div class="logo">RENE<span class="x">X</span></div>
  <div class="status" id="loadingStatus"><span class="spinner"></span> Checking invitation…</div>
</div>

<!-- EINLADUNGS-KARTE -->
<div class="card" id="inviteCard" style="display:none">
  <div class="logo">RENE<span class="x">X</span></div>

  <!-- Shield-Icon in Accent-Farbe -->
  <div class="invite-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z"/>
      <polyline points="9 12 11 14 15 10"/>
    </svg>
  </div>

  <div>
    <div class="invite-title" id="chatName">Chat</div>
    <div class="invite-sub" id="invitedByText" style="margin-top:6px"></div>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px">
    <div class="info-row"><span id="info-access"></span></div>
    <div class="info-row"><span id="info-messages"></span></div>
    <div class="info-row"><span id="info-e2e"></span></div>
  </div>

  <!-- Turnstile Widget -->
  <div class="cf-turnstile"
       data-sitekey="0x4AAAAAACtyEOf-Gqc2i4DY"
       data-theme="dark"
       data-language="en"
       data-callback="onTurnstileSolved"
       data-expired-callback="onTurnstileExpired"
       data-error-callback="onTurnstileError"
       style="display:flex; justify-content:center; margin-bottom:12px; position:relative; z-index:1;">
  </div>

  <label class="join-consent" for="join-consent">
    <input type="checkbox" id="join-consent" />
    <span>
      <span id="consent-prefix">Ich akzeptiere die</span>
      <a href="/agb/" target="_blank" rel="noopener" id="consent-terms-link">AGB</a>
      <span id="consent-and">und</span>
      <a href="/datenschutz/" target="_blank" rel="noopener" id="consent-privacy-link">Datenschutzerklärung</a><span id="consent-suffix">.</span>
    </span>
  </label>

  <button class="btn btn-primary" id="joinBtn" onclick="joinAsGuest()" disabled style="position:relative; z-index:2;">
    Join as guest
  </button>

  <hr class="divider" />

  <button class="btn btn-ghost" id="loginJoinBtn" onclick="goLogin()">
    Sign in &amp; join
  </button>

  <div class="status" id="joinStatus"></div>
</div>

<!-- FEHLER-KARTE -->
<div class="card" id="errorCard">
  <div class="logo">RENE<span class="x">X</span></div>
  <div class="invite-icon">❌</div>
  <div class="invite-title" id="errorTitle">Invalid invitation</div>
  <div class="invite-sub" id="errorMsg">This invitation link has expired or has already been used.</div>
  <button class="btn btn-ghost" id="goHomeBtn" onclick="window.location.href='/'">Go to home</button>
</div>

<script type="module">
  import lang from "/js/i18n.js";
  import { setGuestSession, getGuestSession } from "/js/shared/guestStorage.js";

  const API = "https://api.renex.id";
  const token = new URLSearchParams(location.search).get("token");

  // ── i18n static strings ───────────────────────────────
  document.title = lang.invitePageTitle;
  document.getElementById("loadingStatus").innerHTML = `<span class="spinner"></span> ${lang.checkingInvite}`;
  document.getElementById("joinBtn").textContent     = lang.joinAsGuestBtn;
  document.getElementById("loginJoinBtn").textContent = lang.loginAndJoinBtn;
  document.getElementById("goHomeBtn").textContent   = lang.goHomeBtn;
  document.getElementById("info-access").innerHTML   = lang.accessFor24h;
  document.getElementById("info-messages").innerHTML = lang.maxMessages;
  document.getElementById("info-e2e").textContent    = lang.e2eEncrypted;

  // ── Consent Checkbox: i18n + sprach-abhängige URLs ───
  document.getElementById("consent-prefix").textContent  = lang.consentPrefix;
  document.getElementById("consent-and").textContent     = lang.consentAnd;
  document.getElementById("consent-terms-link").textContent   = lang.consentTerms;
  document.getElementById("consent-privacy-link").textContent = lang.consentPrivacy;
  document.getElementById("consent-suffix").textContent  = lang.consentSuffix;
  const uiLang = localStorage.getItem("renex_lang") || "en";
  if (uiLang !== "de") {
    document.getElementById("consent-terms-link").href   = "/terms/";
    document.getElementById("consent-privacy-link").href = "/privacy/";
  }

  // Consent Checkbox aktiviert/deaktiviert Button (zusammen mit Turnstile)
  const consentCb = document.getElementById("join-consent");
  if (consentCb) {
    consentCb.addEventListener("change", () => {
      window.__consentOk = consentCb.checked;
      if (window.__updateJoinBtn) window.__updateJoinBtn();
    });
  }

  // Turnstile-Callbacks sind bereits im inline <head>-Script definiert
  // (damit der Callback-Race vermieden wird). Wir lesen hier nur den Token.
  // Falls Turnstile bereits gelöst war bevor Module lief: button-state nachziehen
  if (window.__updateJoinBtn) window.__updateJoinBtn();

  // ── Startup ───────────────────────────────────────────
  (async () => {
    if (!token) return showError(lang.invalidInviteTitle, lang.noTokenMsg);

    // Helper: Redirect zum Chat mit der existierenden Guest-Session
    const redirectToExistingChat = (existing) => {
      let target;
      if (existing.convoType === "group") {
        target = existing.convoId;
      } else {
        // DM: convoId ist "alice:guest_xyz" → inviter ist der andere Teil
        target = existing.inviterHandle
              || (existing.convoId && existing.convoId.split(":").find(h => h !== existing.guestHandle))
              || existing.convoId;
      }
      if (!target) return false;
      console.log("[join] existing session gefunden → redirect zu chat:", target);
      window.location.replace(`/chat/?with=${encodeURIComponent(target)}&guest=1`);
      return true;
    };

    // ── Vor /invite/info: Haben wir bereits eine lokale Session für
    // GENAU DIESEN Invite-Token? Kann passieren wenn Gast den Tab aus Versehen
    // geschlossen hat. Der Invite-Token ist serverseitig "__used__", aber
    // die Session-Cookie + localStorage sind noch gültig → direkt in den Chat.
    let existingSession = null;
    try {
      existingSession = getGuestSession();
      console.log("[join] existingSession:", !!existingSession, "| inviteToken match:",
                  existingSession?.inviteToken === token, "| url token:", token?.slice(0, 12));
      if (existingSession && existingSession.inviteToken === token && existingSession.convoId) {
        if (redirectToExistingChat(existingSession)) return;
      }
    } catch (e) {
      console.warn("guestSession check failed", e);
    }

    try {
      // credentials: "include" + X-Guest-Token → Server kann für bereits benutzte
      // DM-Invites prüfen, ob der Requester eine gültige Session hat und die
      // Redirect-Daten zurückgeben (statt "already_used"). Safari ITP kann
      // localStorage dropen, während Cookie noch gilt (oder umgekehrt) — daher
      // beide Kanäle senden.
      const headers = {};
      if (existingSession && existingSession.token) {
        headers["X-Guest-Token"] = existingSession.token;
      }
      const res  = await fetch(`${API}/invite/info?token=${encodeURIComponent(token)}`, {
        credentials: "include",
        headers,
      });
      const data = await res.json().catch(() => ({}));

      // Server hat erkannt: Invite bereits benutzt, aber Session ist gültig → resume
      if (data.valid && data.resumed) {
        console.log("[join] Server-Fallback: resumed session → redirect");
        // localStorage wiederherstellen falls verloren (Safari ITP, PWA-Wechsel, ...)
        try {
          setGuestSession({
            guestHandle:   data.guestHandle,
            convoId:       data.convoId,
            convoType:     data.convoType,
            inviterHandle: data.inviterHandle,
            expiresAt:     data.expiresAt,
            msgLimit:      data.msgLimit,
            msgCount:      data.msgCount ?? 0,
            token:         data.sessionToken,
            inviteToken:   token,
          });
        } catch (e) { console.warn("setGuestSession (resumed) failed", e); }
        const target = data.convoType === "group"
          ? data.convoId
          : (data.inviterHandle || data.convoId);
        window.location.replace(`/chat/?with=${encodeURIComponent(target)}&guest=1`);
        return;
      }

      if (!res.ok || !data.valid) {
        const reason = data.reason || (res.status === 404 ? "not_found" : res.status === 410 ? "already_used" : null);

        // Fallback: Server sagt "already_used" ABER wir haben eine gültige lokale
        // Session — z.B. Session wurde VOR meinem inviteToken-Fix erstellt und hat
        // daher keinen inviteToken-Eintrag zum Matchen. Besser: trotzdem redirecten
        // als stale "already_used"-Fehler zeigen. Server-Cookie ist 24h gültig.
        if (reason === "already_used" && existingSession && existingSession.convoId) {
          console.log("[join] 'already_used' aber lokale Session vorhanden → trotzdem redirect");
          if (redirectToExistingChat(existingSession)) return;
        }

        const msgs = {
          expired:      lang.inviteExpiredReason,
          converted:    lang.inviteAlreadyUsed,
          already_used: lang.inviteAlreadyUsedDm,
          not_found:    lang.inviteNotFound,
          inviter_left: lang.inviteInviterLeft,
        };
        return showError(lang.invalidInviteTitle, msgs[reason] || lang.unknownError);
      }

      document.getElementById("chatName").textContent = data.displayName || "Chat";
      document.getElementById("invitedByText").innerHTML = lang.invitedByText(data.createdBy || "?");

      // Eingeloggter User (ECHTER Account, kein Gast)? → sofort beitreten
      // Guest-Handles (guest_xyz) werden von chat.js auch in my_user gesetzt,
      // sind aber KEINE echten Logins → sonst würde joinAsLoggedInUser mit
      // einem abgelaufenen Gast-Cookie fehlschlagen.
      const myUser = localStorage.getItem("my_user");
      const isRealLogin = myUser && !myUser.startsWith("guest_");
      if (isRealLogin) {
        hide("loadingCard");
        document.getElementById("loadingStatus").innerHTML =
          `<span class="spinner"></span> ${lang.joiningText}`;
        show("loadingCard");
        await joinAsLoggedInUser();
        return;
      }

      // Stale Guest-Handle in my_user entfernen — der User tritt jetzt
      // einem NEUEN Invite bei, soll als frischer Gast durchlaufen.
      if (myUser && myUser.startsWith("guest_")) {
        try { localStorage.removeItem("my_user"); } catch {}
      }

      show("inviteCard");
      hide("loadingCard");

    } catch (e) {
      showError(lang.connectionError, lang.checkConnection);
    }
  })();

  // ── Join ─────────────────────────────────────────────
  window.joinAsGuest = async function() {
    const btn = document.getElementById("joinBtn");
    const status = document.getElementById("joinStatus");
    btn.disabled = true;
    status.className = "status";
    status.innerHTML = `<span class="spinner"></span> ${lang.joiningText}`;

    // ── Ephemeres E2E-Schlüsselpaar generieren ────────────────────────
    let publicKeyJwk = null;
    let guestDeviceId = null;
    try {
      guestDeviceId = "gdev_" + Array.from(crypto.getRandomValues(new Uint8Array(12)))
        .map(b => b.toString(16).padStart(2, "0")).join("");
      const keyPair = await crypto.subtle.generateKey(
        { name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]
      );
      const privJwk = await crypto.subtle.exportKey("jwk", keyPair.privateKey);
      publicKeyJwk  = await crypto.subtle.exportKey("jwk", keyPair.publicKey);
      // In localStorage speichern (persistent — überlebt Tab-Close).
      // setGuestSession wird später nach erfolgreichem Join aufgerufen und
      // persistiert Session + Priv-Key + Device-ID zusammen.
      // Bis dahin als temporäre Vars in diesem Scope halten.
      window.__pendingGuestPrivJwk = JSON.stringify(privJwk);
      window.__pendingGuestDeviceId = guestDeviceId;
    } catch (e) {
      console.warn("⚠️ E2E Key-Generierung fehlgeschlagen:", e);
    }
    // ─────────────────────────────────────────────────────────────────

    // Turnstile-Token aus globalem Storage lesen (gesetzt vom inline Callback)
    const cfToken = window.__cfToken;
    if (!cfToken) {
      status.className = "status error";
      status.textContent = lang.captchaRequired;
      btn.disabled = false;
      return;
    }

    try {
      const res  = await fetch(`${API}/invite/join`, {
        method:      "POST",
        credentials: "include",
        headers:     { "Content-Type": "application/json" },
        body:        JSON.stringify({ token, publicKeyJwk, guestDeviceId, cfTurnstileToken: cfToken, termsVersion: window.TERMS_VERSION }),
      });
      const data = await res.json();

      if (res.status === 403 || (!res.ok && data.error === "Human verification failed")) {
        status.className = "status error";
        status.textContent = lang.captchaFailed;
        btn.disabled = true;
        window.__cfToken = null;
        if (window.turnstile) window.turnstile.reset();
        return;
      }

      if (!res.ok || !data.ok) {
        status.className = "status error";
        status.textContent = data.error || lang.joinErrorDefault;
        btn.disabled = false;
        return;
      }

      // Gast-Session in localStorage persistieren (überlebt Tab-Close).
      // Helper speichert Session + E2E-Priv-Key + Device-ID atomar.
      // WICHTIG: inviteToken speichern damit beim Wieder-Öffnen des
      // DM-Links (Tab war zu) die Session matched werden kann, obwohl
      // der Invite-Token serverseitig als "__used__" markiert ist.
      setGuestSession({
        guestHandle:   data.guestHandle,
        convoId:       data.convoId,
        convoType:     data.convoType,
        inviterHandle: data.inviterHandle,
        expiresAt:     data.expiresAt,
        msgLimit:      data.msgLimit,
        msgCount:      data.msgCount,
        deviceId:      guestDeviceId,
        token:         data.sessionToken,
        inviteToken:   token,   // ← NEU: URL-Token für Re-Open-Matching
      }, {
        privJwk:  window.__pendingGuestPrivJwk || null,
        deviceId: window.__pendingGuestDeviceId || guestDeviceId,
      });
      delete window.__pendingGuestPrivJwk;
      delete window.__pendingGuestDeviceId;

      status.className = "status ok";
      status.textContent = lang.successRedirecting;

      setTimeout(() => {
        const groupName = document.getElementById("chatName")?.textContent || "";
        const nameParam = groupName ? `&name=${encodeURIComponent(groupName)}` : "";
        if (data.convoType === "group") {
          window.location.href = `/chat/?with=${encodeURIComponent(data.convoId)}&guest=1${nameParam}`;
        } else {
          const inviter = data.inviterHandle || data.convoId.split(":").find(h => h !== data.guestHandle);
          window.location.href = `/chat/?with=${encodeURIComponent(inviter)}&guest=1${nameParam}`;
        }
      }, 800);

    } catch (e) {
      status.className = "status error";
      status.textContent = lang.networkErrorRetry;
      btn.disabled = false;
    }
  };

  // ── Join als eingeloggter User ────────────────────────
  async function joinAsLoggedInUser() {
    const loadingStatus = document.getElementById("loadingStatus");
    const setStatus = (html) => { if (loadingStatus) loadingStatus.innerHTML = html; };

    try {
      const res  = await fetch(`${API}/invite/join-auth`, {
        method:      "POST",
        credentials: "include",
        headers:     { "Content-Type": "application/json" },
        body:        JSON.stringify({ token }),
      });
      const data = await res.json();

      if (!res.ok || !data.ok) {
        return showError(lang.joinErrorTitle, data.error || lang.joinErrorRetry);
      }

      setStatus("✓ " + lang.successRedirecting);

      setTimeout(() => {
        const target = data.convoType === "group" ? data.convoId : (data.inviterHandle || data.convoId);
        window.location.href = `/chat/?with=${encodeURIComponent(target)}`;
      }, 600);

    } catch (e) {
      showError(lang.connectionError, lang.checkConnection);
    }
  }

  // ── Helpers ───────────────────────────────────────────
  window.goLogin = function() {
    sessionStorage.setItem("pendingInviteRedirect", location.href);
    window.location.href = "/";
  };

  function showError(title, msg) {
    document.getElementById("errorTitle").textContent = title;
    document.getElementById("errorMsg").textContent   = msg;
    hide("loadingCard");
    hide("inviteCard");
    show("errorCard");
  }

  function show(id) { document.getElementById(id).style.display = "block"; }
  function hide(id) { document.getElementById(id).style.display = "none"; }
</script>
</body>
</html>
