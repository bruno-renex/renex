name = "renex-backend"
main = "backend.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.renex.id", custom_domain = true }
]

[[kv_namespaces]]
binding = "RENEX_KV"
id = "abfb6fb7ffd6433097e9b4ea9c7f1225"

[[d1_databases]]
binding = "RENEX_DB"
database_name = "renex-db"
database_id = "ab5fe365-29d0-4bb8-bfee-db20ec6e84b8"

[[durable_objects.bindings]]
name = "USER_SESSION_DO"
class_name = "UserSessionDO"

[[migrations]]
tag = "v1"
new_classes = ["UserSessionDO"]

[[r2_buckets]]
binding = "RENEX_FILES"
bucket_name = "renex-files"

[triggers]
crons = ["0 3 * * *"]

# ======================================================
# VAPID Keys für Web Push Notifications
# Public Key = im Frontend (VAPID applicationServerKey)
# Private Key = nur Backend (JWT-Signierung)
#
# GENERIEREN:
#   npx web-push generate-vapid-keys
#
# Dann hier eintragen oder als Secrets:
#   npx wrangler secret put VAPID_PRIVATE_KEY
# ======================================================
[vars]
VAPID_PUBLIC_KEY = "BLGeZcfZpaaGx0XNAeyVyz-ascSLrH12gfFg8OgkR29AWQcMlze6xBQpnq4SV8b48U9xWCfb6g8c_ilQ-4YwQZA"
VAPID_SUBJECT = "mailto:push@renex.id"
# VAPID_PRIVATE_KEY → als Secret setzen: npx wrangler secret put VAPID_PRIVATE_KEY

# ── SENTRY (Error-Tracking) ──────────────────────────
# Frontend-DSN ist publik (wird im Browser-Code sichtbar). EU/Germany-Instanz
# für DSGVO/DSG-Compliance. Backend-DSN ist Secret (npx wrangler secret put).
SENTRY_DSN_FRONTEND = "https://35f8669f2fae3c4e5d2cfe51588f7160@o4511293601218560.ingest.de.sentry.io/4511293715710032"
ENVIRONMENT = "production"
