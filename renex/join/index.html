<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RENEX – Einladung</title>
  <link rel="stylesheet" href="/colors.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-body, #07070A);
      color: var(--text-primary, #E6E6EB);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--bg-panel, #0D0D11);
      border: 1px solid var(--border-panel, rgba(255,255,255,0.06));
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-primary, #E6E6EB);
    }
    .logo .x { color: var(--accent-voice, #38BDF8); }

    /* Shield-Icon in Accent-Farbe statt Emoji */
    .invite-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .invite-icon svg {
      width: 44px;
      height: 44px;
      color: var(--accent-voice, #38BDF8);
      filter: drop-shadow(0 0 10px var(--accent-voice-glow, rgba(56,189,248,0.35)));
    }

    .invite-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary, #E6E6EB);
    }

    .invite-sub {
      font-size: 13px;
      color: var(--text-secondary, #9A9AA3);
      line-height: 1.5;
    }

    /* Info-Rows: linke Accent-Linie statt Box */
    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 2px solid var(--accent-voice, #38BDF8);
      padding: 8px 0 8px 14px;
      font-size: 13px;
      color: var(--text-secondary, #9A9AA3);
      text-align: left;
    }
    .info-row span { flex: 1; }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, box-shadow 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Primary Button mit Glow wie Chat-Bubbles */
    .btn-primary {
      background: var(--accent-voice, #38BDF8);
      color: #07070A;
      box-shadow: 0 0 16px var(--accent-voice-glow, rgba(56,189,248,0.35));
    }
    .btn-primary:hover {
      box-shadow: 0 0 24px var(--accent-voice-glow, rgba(56,189,248,0.45));
    }

    /* Ghost-Button: reiner Text-Link, kein Border */
    .btn-ghost {
      background: transparent;
      border: none;
      color: var(--text-muted, #6F6F78);
      font-size: 13px;
      padding: 8px;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--border-subtle, #1C1C24);
    }
    .btn-ghost:hover {
      color: var(--text-secondary, #9A9AA3);
      opacity: 1;
    }

    .status {
      font-size: 13px;
      color: var(--text-secondary, #9A9AA3);
      min-height: 18px;
    }
    .status.error { color: var(--status-error, #F87171); }
    .status.ok    { color: var(--status-speaking, #3CE47A); }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      border: none;
      border-top: 1px solid var(--border-subtle, #1C1C24);
    }

    #errorCard { display: none; }
  </style>
</head>
<body>

<!-- LADE-STATE -->
<div class="card" id="loadingCard">
  <div class="logo">RENE<span class="x">X</span></div>
  <div class="status"><span class="spinner"></span> Einladung wird geprüft…</div>
</div>

<!-- EINLADUNGS-KARTE -->
<div class="card" id="inviteCard" style="display:none">
  <div class="logo">RENE<span class="x">X</span></div>

  <!-- Shield-Icon in Accent-Farbe -->
  <div class="invite-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z"/>
      <polyline points="9 12 11 14 15 10"/>
    </svg>
  </div>

  <div>
    <div class="invite-title" id="chatName">Chat</div>
    <div class="invite-sub" style="margin-top:6px">
      Du wurdest von <strong id="invitedBy"></strong> eingeladen
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px">
    <div class="info-row">
      <span>Zugang für <strong>48 Stunden</strong> — dann mit Passkey speichern</span>
    </div>
    <div class="info-row">
      <span>Maximal <strong>50 Nachrichten</strong> als Gast</span>
    </div>
    <div class="info-row">
      <span>Ende-zu-Ende verschlüsselt</span>
    </div>
  </div>

  <button class="btn btn-primary" id="joinBtn" onclick="joinAsGuest()">
    Als Gast beitreten
  </button>

  <hr class="divider" />

  <button class="btn btn-ghost" onclick="goLogin()">
    Anmelden &amp; beitreten
  </button>

  <div class="status" id="joinStatus"></div>
</div>

<!-- FEHLER-KARTE -->
<div class="card" id="errorCard">
  <div class="logo">RENE<span class="x">X</span></div>
  <div class="invite-icon">❌</div>
  <div class="invite-title" id="errorTitle">Einladung ungültig</div>
  <div class="invite-sub" id="errorMsg">Dieser Einladungslink ist abgelaufen oder wurde bereits verwendet.</div>
  <button class="btn btn-ghost" onclick="window.location.href='/'">Zur Startseite</button>
</div>

<script>
  const API = "https://api.renex.id";
  const token = new URLSearchParams(location.search).get("token");

  // ── Startup ───────────────────────────────────────────
  (async () => {
    if (!token) return showError("Kein Token", "Dieser Link ist ungültig.");

    try {
      const res  = await fetch(`${API}/invite/info?token=${encodeURIComponent(token)}`);
      const data = await res.json();

      if (!data.valid) {
        const msgs = {
          expired:   "Dieser Einladungslink ist abgelaufen.",
          converted: "Dieser Link wurde bereits verwendet.",
          not_found: "Dieser Link existiert nicht.",
        };
        return showError("Einladung ungültig", msgs[data.reason] || "Unbekannter Fehler.");
      }

      document.getElementById("chatName").textContent  = data.displayName || "Chat";
      document.getElementById("invitedBy").textContent = data.createdBy   || "jemandem";

      // Eingeloggter User? → sofort beitreten, kein Klick nötig
      const myUser = localStorage.getItem("my_user");
      if (myUser) {
        hide("loadingCard");
        // Lade-Karte mit Spinner zeigen, direkt beitreten
        document.getElementById("loadingCard").querySelector(".status").innerHTML =
          '<span class="spinner"></span> Beitreten…';
        show("loadingCard");
        await joinAsLoggedInUser();
        return;
      }

      show("inviteCard");
      hide("loadingCard");

    } catch (e) {
      showError("Verbindungsfehler", "Bitte überprüfe deine Internetverbindung.");
    }
  })();

  // ── Join ─────────────────────────────────────────────
  async function joinAsGuest() {
    const btn = document.getElementById("joinBtn");
    const status = document.getElementById("joinStatus");
    btn.disabled = true;
    status.className = "status";
    status.innerHTML = '<span class="spinner"></span> Beitreten…';

    // ── Ephemeres E2E-Schlüsselpaar generieren ────────────────────────
    let publicKeyJwk = null;
    let guestDeviceId = null;
    try {
      guestDeviceId = "gdev_" + Array.from(crypto.getRandomValues(new Uint8Array(12)))
        .map(b => b.toString(16).padStart(2, "0")).join("");
      const keyPair = await crypto.subtle.generateKey(
        { name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]
      );
      const privJwk = await crypto.subtle.exportKey("jwk", keyPair.privateKey);
      publicKeyJwk  = await crypto.subtle.exportKey("jwk", keyPair.publicKey);
      sessionStorage.setItem("guest_e2e_priv_jwk", JSON.stringify(privJwk));
      sessionStorage.setItem("guest_device_id", guestDeviceId);
    } catch (e) {
      console.warn("⚠️ E2E Key-Generierung fehlgeschlagen:", e);
    }
    // ─────────────────────────────────────────────────────────────────

    try {
      const res  = await fetch(`${API}/invite/join`, {
        method:      "POST",
        credentials: "include",
        headers:     { "Content-Type": "application/json" },
        body:        JSON.stringify({ token, publicKeyJwk, guestDeviceId }),
      });
      const data = await res.json();

      if (!res.ok || !data.ok) {
        status.className = "status error";
        status.textContent = data.error || "Fehler beim Beitreten.";
        btn.disabled = false;
        return;
      }

      // Gast-Daten im sessionStorage für den Chat speichern
      sessionStorage.setItem("guestSession", JSON.stringify({
        guestHandle:   data.guestHandle,
        convoId:       data.convoId,
        convoType:     data.convoType,
        inviterHandle: data.inviterHandle,
        expiresAt:     data.expiresAt,
        msgLimit:      data.msgLimit,
        msgCount:      data.msgCount,
        deviceId:      guestDeviceId,
        token,
      }));

      status.className = "status ok";
      status.textContent = "Erfolgreich! Leite weiter…";

      // Weiterleitung in den Chat
      setTimeout(() => {
        const groupName = document.getElementById("chatName")?.textContent || "";
        const nameParam = groupName ? `&name=${encodeURIComponent(groupName)}` : "";
        if (data.convoType === "group") {
          // Gruppe: withUser = groupUUID
          window.location.href = `/chat/?with=${encodeURIComponent(data.convoId)}&guest=1${nameParam}`;
        } else {
          // DM: withUser = Einladender (damit dmConvoId korrekt berechnet wird)
          const inviter = data.inviterHandle || data.convoId.split(":").find(h => h !== data.guestHandle);
          window.location.href = `/chat/?with=${encodeURIComponent(inviter)}&guest=1${nameParam}`;
        }
      }, 800);

    } catch (e) {
      status.className = "status error";
      status.textContent = "Netzwerkfehler. Bitte erneut versuchen.";
      btn.disabled = false;
    }
  }

  // ── Join als eingeloggter User ────────────────────────
  async function joinAsLoggedInUser() {
    // Status in der Loading-Card anzeigen (kein Klick-Flow)
    const loadingStatus = document.getElementById("loadingCard").querySelector(".status");
    const setStatus = (html) => { if (loadingStatus) loadingStatus.innerHTML = html; };

    try {
      const res  = await fetch(`${API}/invite/join-auth`, {
        method:      "POST",
        credentials: "include",
        headers:     { "Content-Type": "application/json" },
        body:        JSON.stringify({ token }),
      });
      const data = await res.json();

      if (!res.ok || !data.ok) {
        return showError("Fehler beim Beitreten", data.error || "Bitte erneut versuchen.");
      }

      setStatus("✓ Erfolgreich! Leite weiter…");

      setTimeout(() => {
        const target = data.convoType === "group" ? data.convoId : (data.inviterHandle || data.convoId);
        window.location.href = `/chat/?with=${encodeURIComponent(target)}`;
      }, 600);

    } catch (e) {
      showError("Netzwerkfehler", "Bitte überprüfe deine Internetverbindung.");
    }
  }

  // ── Helpers ───────────────────────────────────────────
  function goLogin() {
    // Join-URL im sessionStorage merken → nach Login zurückspringen
    sessionStorage.setItem("pendingInviteRedirect", location.href);
    window.location.href = "/";
  }

  function showError(title, msg) {
    document.getElementById("errorTitle").textContent = title;
    document.getElementById("errorMsg").textContent   = msg;
    hide("loadingCard");
    hide("inviteCard");
    show("errorCard");
  }

  function show(id) { document.getElementById(id).style.display = ""; }
  function hide(id) { document.getElementById(id).style.display = "none"; }
</script>
</body>
</html>
