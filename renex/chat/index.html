<!-- chat.html version v2 -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Chat</title>
  <link rel="stylesheet" href="/colors.css" />
  <style>
    body { font-family: sans-serif; }

#chat-menu-btn:hover { background: var(--bg-hover, rgba(255,255,255,0.06)); }
#chat-menu-btn:active { background: var(--bg-active, rgba(255,255,255,0.1)); }

#new-indicator {
  display: none;
  position: sticky;
  bottom: 60px;
  margin: 0 auto;
  padding: 10px 14px;
  background: var(--indicator-bg);
  color: var(--indicator-text);
  text-align: center;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  z-index: 10;

  opacity: 0;
  pointer-events: none;
}

#new-indicator.visible {
  display: block;
  opacity: 1;
  pointer-events: auto;
}

    #messages {
  border: 1px solid var(--border-subtle);
  padding: 10px;
  height: 300px;
  overflow-y: auto;
  background: var(--bg-body);
  position: relative;
  }

  /* Basis für jede Nachricht */
    #messages div {
  max-width: 70%;
  margin: 6px 0;
  padding: 8px 12px;
  border-radius: 12px;
  word-wrap: break-word;
  }
      .me {
      margin-left: auto;
      background: var(--chat-self-bg);
      color: var(--chat-self-text);
      border: 1px solid var(--chat-self-border);
      text-align: right;
    }

    .other {
      margin-right: auto;
      background: var(--chat-peer-bg);
      color: var(--chat-peer-text);
      text-align: left;
    }
#length-warning {
  font-size: 12px;
  margin-top: 4px;
  color: var(--text-secondary);
  text-align: right;
}

#length-warning.warn {
  color: var(--status-warn);
  font-weight: bold;
}

#length-warning.error {
  color: var(--status-error);
  font-weight: bold;
}
/* Timestamp unter jeder Nachricht */
.timestamp {
  font-size: 11px;
  opacity: 0.6;
  margin-top: 4px;
}

/* Timestamp rechts bei eigenen Nachrichten */
.me .timestamp {
  text-align: right;
}

/* Timestamp links bei anderen Nachrichten */
.other .timestamp {
  text-align: left;
}

/* =========================
   Pending Message (Bootstrap / Retry)
   ========================= */

.me.pending {
  opacity: 0.6;
}

.me.pending::after {
  content: " ⏳";
  font-size: 0.9em;
  opacity: 0.7;
}

/* =========================
   Delete Button
   ========================= */

.delete-btn {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 0.75em;
  opacity: 0.4;
  padding: 0 2px;
  margin-left: 4px;
  vertical-align: middle;
  transition: opacity 0.15s;
}

.me:hover .delete-btn {
  display: inline;
}

.delete-btn:hover {
  opacity: 0.9;
}

/* =========================
   Input
   ========================= */

textarea {
  background: var(--input-bg);
  color: var(--input-text);
  border-color: var(--border-input);
  caret-color: var(--input-caret);
}

textarea::placeholder {
  color: var(--input-placeholder);
}

  </style>
</head>
<body>

<div id="chat-header" style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border-panel);background:var(--bg-panel);position:sticky;top:0;z-index:20;gap:8px;">
  <button onclick="history.back()" style="background:none;border:none;color:var(--accent);font-size:15px;cursor:pointer;padding:4px 8px;border-radius:6px;">←</button>
  <div style="position:relative;flex:1;display:flex;justify-content:center;">
    <button id="chat-menu-btn" style="background:none;border:none;color:inherit;font-size:16px;font-weight:600;cursor:pointer;padding:4px 12px;border-radius:8px;display:flex;align-items:center;gap:5px;transition:background 0.15s;">
      <span id="chat-with"></span>
      <span style="font-size:10px;color:var(--text-secondary);margin-top:1px;">▼</span>
    </button>
    <div id="chat-menu-dropdown" style="display:none;position:absolute;left:50%;transform:translateX(-50%);top:38px;background:var(--bg-panel);border:1px solid var(--border-panel);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.4);min-width:190px;padding:6px 0;z-index:50;">
      <div id="chat-menu-autodelete" style="padding:10px 16px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;position:relative;">
        <span>🗑️ Auto-Delete</span>
        <span id="chat-autodelete-label" style="color:var(--accent);font-size:12px;font-weight:600;">Aus</span>
        <div id="chat-autodelete-submenu" style="display:none;position:absolute;left:calc(100% + 6px);top:0;background:var(--bg-panel);border:1px solid var(--border-panel);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.4);min-width:130px;padding:6px 0;z-index:60;">
          <div class="chat-ad-opt" data-days="" style="padding:8px 16px;cursor:pointer;font-size:13px;">Aus</div>
          <div class="chat-ad-opt" data-days="1" style="padding:8px 16px;cursor:pointer;font-size:13px;">1 Tag</div>
          <div class="chat-ad-opt" data-days="7" style="padding:8px 16px;cursor:pointer;font-size:13px;">1 Woche</div>
          <div class="chat-ad-opt" data-days="28" style="padding:8px 16px;cursor:pointer;font-size:13px;">4 Wochen</div>
          <div class="chat-ad-opt" data-days="90" style="padding:8px 16px;cursor:pointer;font-size:13px;">90 Tage</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="messages"></div>

<div id="new-indicator">
  <span id="unread-count">0</span><span id="new-messages-suffix" data-i18n="newMessagesSuffix"> neue Nachrichten ↓</span>
</div>

<textarea
  id="msg-input"
  placeholder="Nachricht…"
  data-i18n-placeholder="messagePlaceholder"
  rows="2"
  style="width:100%; resize:none;"
></textarea>

<!-- 👇 DAS HINZUFÜGEN -->
<div id="length-warning"></div>

<button id="send-btn" data-i18n="sendBtn">Senden</button>

<script type="module" src="/js/controlPoller.js"></script>
<script type="module" src="/js/chat.js?v=99"></script>
<script type="module">
  import { applyI18n } from "/js/i18n.js";
  applyI18n();
</script>

</body>
</html>
