<!DOCTYPE html>
<html lang="de" data-i18n-title="loginBtn">
<head>
  <meta charset="UTF-8" />
  <title>RENEX</title>
  <link rel="stylesheet" href="/colors.css" />
    <style>
    .renex-logo {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-primary);
      user-select: none;
      margin: 0;
    }

    .renex-logo .x {
      color: var(--accent-voice);
      text-shadow:
        0 0 12px rgba(56, 189, 248, 0.7),
        0 0 28px rgba(56, 189, 248, 0.35);
    }

    .renex-slogan {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 6px 0 0 0;
      user-select: none;
    }

    #lang-switcher {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle, rgba(255,255,255,0.1));
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .lang-btn:hover {
      background: var(--bg-panel, rgba(255,255,255,0.06));
      color: var(--text-primary);
    }

    .lang-btn.active {
      border-color: var(--accent-voice, #38bdf8);
      color: var(--text-primary);
      background: var(--bg-panel, rgba(255,255,255,0.06));
    }

    .lang-flag {
      font-size: 15px;
      line-height: 1;
    }
  </style>
</head>
<body>

  <h1 class="renex-logo">RENE<span class="x">X</span></h1>
  <p class="renex-slogan">Connect. Alive. Private.</p>

<input
  id="handle"
  type="text"
  placeholder="Name"
  data-i18n-placeholder="loginPlaceholder"
  autocomplete="username"
  spellcheck="false"
/>
  <button id="loginBtn" data-i18n="loginBtn">Login mit Passkey</button>
<span id="loginStatus" style="margin-left:10px;"></span>


<div id="lang-switcher">
  <button id="lang-de" class="lang-btn">
    <span class="lang-flag">🇩🇪</span> DE
  </button>
  <button id="lang-en" class="lang-btn">
    <span class="lang-flag">🇬🇧</span> EN
  </button>
</div>


<script type="module">
import { loginWithPasskey } from "./js/auth.js";
import { apiFetch } from "./js/api.js";
import lang, { applyI18n, getLang, setLang } from "./js/i18n.js";
applyI18n();

// =========================================
// 🔐 SICHERER AUTO-LOGIN CHECK
// =========================================
async function checkExistingSession() {
  try {
    // Cookie wird automatisch mitgeschickt — kein Token in localStorage
    await apiFetch("/users/me");
    // ✅ Session gültig → Inbox
    window.location.replace("./inbox.html");
  } catch (e) {
    // ❌ Kein Cookie / Session abgelaufen → Login-Seite bleiben
    localStorage.removeItem("my_user");
  }
}

// 🔥 SOFORT BEIM LADEN AUSFÜHREN
window.addEventListener("DOMContentLoaded", checkExistingSession);

// =========================================
// 🔐 LOGIN BUTTON
// =========================================
const loginBtn = document.getElementById("loginBtn");
const loginStatus = document.getElementById("loginStatus");

let loginInProgress = false;

loginBtn.onclick = async () => {

  if (loginInProgress) return; // 🔒 verhindert Doppelklick

  loginInProgress = true;
  loginBtn.disabled = true;
  loginBtn.textContent = lang.loginAuthenticating;
  loginStatus.textContent = "";

  const handle = document.getElementById("handle").value.trim();

if (!handle) {
  alert(lang.loginEnterName);
  loginInProgress = false;
  loginBtn.disabled = false;
  loginBtn.textContent = lang.loginBtn;
  return;
}

  try {
    await loginWithPasskey(handle);
  } catch (e) {
    loginStatus.textContent = lang.loginFailed;
    loginBtn.disabled = false;
    loginBtn.textContent = lang.loginBtn;
    loginInProgress = false;
  }
};

// ── Sprachumschalter ──────────────────────────────────
document.getElementById("lang-de").onclick = () => setLang("de");
document.getElementById("lang-en").onclick = () => setLang("en");
// Aktive Sprache hervorheben
document.getElementById("lang-" + getLang()).classList.add("active");
</script>

</body>
</html>
