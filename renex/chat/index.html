<!-- chat.html version v2 -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#38bdf8" />
  <link rel="manifest" href="/manifest.json" />
  <script>
  if("serviceWorker"in navigator){
    navigator.serviceWorker.register("/sw.js").then(function(){
      if(Notification.permission==="granted"){
        navigator.serviceWorker.ready.then(function(reg){
          reg.pushManager.getSubscription().then(function(sub){
            if(sub)return;
            fetch("/push/vapid-key").then(function(r){return r.json()}).then(function(d){
              var k=d.publicKey,p="=".repeat((4-k.length%4)%4);
              var b=atob((k+p).replace(/-/g,"+").replace(/_/g,"/"));
              var a=Uint8Array.from(Array.prototype.map.call(b,function(c){return c.charCodeAt(0)}));
              return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:a});
            }).then(function(s){
              var j=s.toJSON();
              return fetch("https://api.renex.id/push/subscribe",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:j.endpoint,keys:j.keys,transport_type:"web_push"})});
            }).catch(function(){});
          });
        });
      }
    }).catch(function(){});
  }
  </script>
  <title>Chat</title>
  <link rel="stylesheet" href="/colors.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-body);
      color: var(--text-primary);
    }

    /* ── iOS-Fix: Header fixiert damit er beim Keyboard-Scroll nicht verschwindet ── */
    #chat-header {
      position: fixed !important;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding-top: calc(env(safe-area-inset-top, 0px) + 10px) !important;
    }

    /* Platzhalter damit Messages nicht unter dem Header anfangen */
    #chat-header-spacer {
      flex-shrink: 0;
      height: calc(env(safe-area-inset-top, 0px) + 54px);
    }

#chat-menu-btn:hover { background: var(--bg-hover, rgba(255,255,255,0.06)); }
#chat-menu-btn:active { background: var(--bg-active, rgba(255,255,255,0.1)); }

#new-indicator {
  display: none;
  position: sticky;
  bottom: 60px;
  margin: 0 auto;
  padding: 10px 14px;
  background: var(--indicator-bg);
  color: var(--indicator-text);
  text-align: center;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  z-index: 10;

  opacity: 0;
  pointer-events: none;
}

#new-indicator.visible {
  display: block;
  opacity: 1;
  pointer-events: auto;
}

    #messages {
  flex: 1;
  min-height: 0;
  padding: 10px 12px;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg-body);
  position: relative;
  display: flex;
  flex-direction: column;
  -webkit-overflow-scrolling: touch;
  }

  /* Basis für jede Nachricht */
  .me, .other {
  max-width: 70%;
  margin: 6px 0;
  padding: 8px 12px;
  border-radius: 12px;
  word-wrap: break-word;
  overflow-wrap: break-word;
  word-break: break-word;
  overflow: visible;
  cursor: default;
  }

  /* Gelöschte Nachricht: Text immer vollständig sichtbar */
  [data-deleted="1"] {
    min-width: fit-content;
  }
  [data-deleted="1"] .msg-text {
    display: block;
    overflow: visible;
    white-space: normal;
    padding-right: 2px;
  }

  .me {
    align-self: flex-end;
    background: var(--chat-self-bg);
    color: var(--chat-self-text);
    border: 1px solid var(--chat-self-border);
    text-align: right;
    position: relative;
    padding-top: 14px;
  }

  .other {
    align-self: flex-start;
    background: var(--chat-peer-bg);
    color: var(--chat-peer-text);
    text-align: left;
  }
#length-warning {
  font-size: 12px;
  margin-top: 4px;
  color: var(--text-secondary);
  text-align: right;
}

#length-warning.warn {
  color: var(--status-warn);
  font-weight: bold;
}

#length-warning.error {
  color: var(--status-error);
  font-weight: bold;
}
/* Absender-Name in Gruppen-Nachrichten */
.sender-name {
  font-size: 11px;
  font-weight: 600;
  opacity: 0.75;
  margin-bottom: 2px;
  color: var(--accent, #7c6af7);
}

/* Timestamp unter jeder Nachricht */
.timestamp {
  font-size: 11px;
  opacity: 0.6;
  margin-top: 4px;
}

/* Timestamp rechts bei eigenen Nachrichten */
.me .timestamp {
  text-align: right;
}

/* Timestamp links bei anderen Nachrichten */
.other .timestamp {
  text-align: left;
}

/* =========================
   Pending Message (Bootstrap / Retry)
   ========================= */

.me.pending {
  opacity: 0.6;
}

.me.pending::after {
  content: " ⏳";
  font-size: 0.9em;
  opacity: 0.7;
}

/* =========================
   Gruppen: Absender-Label
   ========================= */

.sender-name {
  font-size: 11px;
  font-weight: 600;
  opacity: 0.55;
  margin-bottom: 2px;
  color: var(--accent-voice);
}

/* Delete + Edit Buttons entfernt — Aktionen sind im Context Menu (Rechtsklick / Long-Press) */

/* =========================
   Context Menu
   ========================= */

#msg-context-menu {
  position: fixed;
  z-index: 600;
  background: var(--bg-panel);
  border: 1px solid var(--border-panel);
  border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.45);
  padding: 6px 0;
  min-width: 170px;
  animation: ctxFadeIn 0.12s ease;
}

@keyframes ctxFadeIn {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}

.ctx-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  font-size: 14px;
  color: var(--text-primary);
  cursor: pointer;
  transition: background 0.1s;
  white-space: nowrap;
}

.ctx-item:hover { background: var(--bg-panel-alt); }
.ctx-item.danger { color: var(--status-error); }
.ctx-item-icon { font-size: 16px; width: 20px; text-align: center; }
.ctx-divider { height: 1px; background: var(--border-subtle); margin: 4px 0; }

/* Emoji Picker im Context Menu */
.ctx-emoji-row {
  display: flex;
  justify-content: space-around;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-subtle);
}

.ctx-emoji-btn {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 8px;
  transition: transform 0.1s, background 0.1s;
  line-height: 1;
}

.ctx-emoji-btn:hover { transform: scale(1.25); background: var(--bg-panel-alt); }
.ctx-emoji-btn.active { background: var(--accent-voice); border-radius: 8px; }

.edit-btn:hover {
  opacity: 0.8;
  color: var(--accent-voice);
}

.edited-badge {
  font-size: 10px;
  color: var(--text-secondary);
  opacity: 0.6;
  font-style: italic;
  margin-left: 4px;
}

/* ── Highlight-Flash beim Scroll zu Original ── */
@keyframes highlightFlash {
  0%   { background: rgba(56,189,248,0.25); }
  100% { background: transparent; }
}
.highlight-flash { animation: highlightFlash 1.2s ease-out; border-radius: 8px; }

/* ── Reply-Bar (über dem Eingabefeld) ────────── */
#reply-bar {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--bg-panel-alt);
  border-top: 1px solid var(--border-subtle);
  font-size: 12px;
  color: var(--text-secondary);
  flex-shrink: 0;
}
#reply-bar.visible { display: flex; }
#reply-bar .reply-bar-preview {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
#reply-bar .reply-bar-from {
  color: var(--accent-voice);
  font-weight: 600;
  margin-right: 4px;
}
#reply-bar-cancel {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 16px;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
  flex-shrink: 0;
}
#reply-bar-cancel:hover { color: var(--text-primary); }

/* ── Quote-Block in Bubble ───────────────────── */
.reply-quote {
  border-left: 3px solid var(--accent-voice);
  padding: 4px 8px;
  margin-bottom: 5px;
  border-radius: 0 6px 6px 0;
  background: rgba(56,189,248,0.07);
  cursor: pointer;
  max-width: 100%;
  overflow: hidden;
}
.reply-quote:hover { background: rgba(56,189,248,0.13); }
.reply-quote-from {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent-voice);
  margin-bottom: 2px;
}
.reply-quote-text {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 220px;
}

/* ── Reaktionen ──────────────────────────────── */
.reaction-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
}
.reaction-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: 12px;
  background: var(--bg-panel-alt);
  border: 1px solid var(--border-subtle);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
  user-select: none;
}
.reaction-pill:hover { background: var(--bg-panel); border-color: var(--accent-voice); }
.reaction-pill.mine  { border-color: var(--accent-voice); background: rgba(56,189,248,0.12); }
.reaction-pill .reaction-count {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
}

/* ── Emoji-Picker ────────────────────────────── */
.reaction-picker {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  display: flex;
  gap: 4px;
  background: var(--bg-panel);
  border: 1px solid var(--border-panel);
  border-radius: 24px;
  padding: 5px 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transform: translateY(4px);
  transition: opacity 0.12s, transform 0.12s;
}
.me .reaction-picker { left: auto; right: 0; }
.reaction-picker.visible { opacity: 1; pointer-events: all; transform: translateY(0); }
.reaction-picker button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 2px;
  border-radius: 6px;
  transition: transform 0.1s;
}
.reaction-picker button:hover { transform: scale(1.3); }

/* Inline-Edit Textarea in Bubble */
.edit-textarea {
  width: 100%;
  min-width: 160px;
  background: var(--bg-panel-alt);
  color: var(--text-primary);
  border: 1px solid var(--accent-voice);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 16px; /* ≥16px verhindert iOS Auto-Zoom */
  font-family: inherit;
  resize: none;
  outline: none;
  box-sizing: border-box;
  line-height: 1.4;
}

/* =========================
   Input
   ========================= */

textarea {
  width: 100%;
  background: var(--input-bg);
  color: var(--input-text);
  border: 1px solid var(--border-input);
  caret-color: var(--input-caret);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 16px; /* ≥16px verhindert iOS Auto-Zoom */
  font-family: inherit;
  resize: none;
  outline: none;
  display: block;
}

textarea::placeholder {
  color: var(--input-placeholder);
}

/* ── Input-Footer (sticky am Bottom) ── */
#chat-input-footer {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-panel);
  border-top: 1px solid var(--border-subtle);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* ── Send-Button ── */
#send-btn {
  margin: 6px 12px 8px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: var(--accent-voice, #38BDF8);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  width: calc(100% - 24px);
  min-height: 44px;
  transition: opacity 0.15s;
}
#send-btn:active { opacity: 0.75; }

/* ── reply-quote-text max-width responsive ── */
.reply-quote-text { max-width: min(220px, 60vw); }

/* ── Presence ─────────────────────────────────────── */
#dm-presence-status {
  font-size: 11px;
  font-weight: 400;
  opacity: 0.75;
  line-height: 1;
  margin-top: 2px;
  min-height: 13px;
}
.presence-dot {
  position: absolute;
  bottom: 1px;
  right: 1px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--bg-body);
  background: #4ade80;
  display: none;
}

/* ── Attach-Bar ───────────────────────────────────── */
#attach-bar button:hover { background: var(--bg-hover, rgba(255,255,255,0.06)); }
#attach-bar button:active { background: var(--bg-active, rgba(255,255,255,0.10)); }

/* ── Attachment-Bubble ────────────────────────────── */
.attachment-bubble {
  margin-bottom: 4px;
}
.attachment-bubble img {
  border-radius: 8px;
  display: block;
}

  </style>
</head>
<body>

<div id="chat-header" style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border-panel);background:var(--bg-panel);gap:8px;">
  <button onclick="(window.parent !== window && typeof window.parent.closeChatPanel === 'function') ? window.parent.closeChatPanel() : window.location.href='/inbox/'" style="background:none;border:none;color:var(--accent);font-size:15px;cursor:pointer;padding:4px 8px;border-radius:6px;">←</button>
  <div style="position:relative;flex:1;display:flex;justify-content:center;">
    <button id="chat-menu-btn" style="background:none;border:none;color:inherit;font-size:16px;font-weight:600;cursor:pointer;padding:4px 12px;border-radius:8px;display:flex;flex-direction:column;align-items:center;transition:background 0.15s;">
      <span id="chat-with"></span>
      <span id="dm-presence-status"></span>
    </button>
    <div id="chat-menu-dropdown" style="display:none;position:absolute;left:50%;transform:translateX(-50%);top:38px;background:var(--bg-panel);border:1px solid var(--border-panel);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.4);min-width:190px;padding:6px 0;z-index:50;">
      <div id="chat-menu-autodelete" style="padding:10px 16px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;position:relative;">
        <span>🗑️ Auto-Delete<span id="chat-autodelete-readonly-hint" style="display:none;font-size:10px;color:var(--text-secondary);margin-left:4px;">(Admin)</span></span>
        <span id="chat-autodelete-label" data-i18n="autoDeleteOff" style="color:var(--accent);font-size:12px;font-weight:600;">Off</span>
        <div id="chat-autodelete-submenu" style="display:none;position:absolute;left:calc(100% + 6px);top:0;background:var(--bg-panel);border:1px solid var(--border-panel);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.4);min-width:130px;padding:6px 0;z-index:60;">
          <div class="chat-ad-opt" data-days="" data-i18n="autoDeleteOff" style="padding:8px 16px;cursor:pointer;font-size:13px;">Aus</div>
          <div class="chat-ad-opt" data-days="0.0417" data-i18n="autoDeleteOneHour" style="padding:8px 16px;cursor:pointer;font-size:13px;">1h</div>
          <div class="chat-ad-opt" data-days="1" data-i18n="autoDeleteOneDay" style="padding:8px 16px;cursor:pointer;font-size:13px;">24h</div>
          <div class="chat-ad-opt" data-days="7" data-i18n="autoDeleteOneWeek" style="padding:8px 16px;cursor:pointer;font-size:13px;">7 Tage</div>
          <div class="chat-ad-opt" data-days="30" data-i18n="autoDeleteThirtyDays" style="padding:8px 16px;cursor:pointer;font-size:13px;">30 Tage</div>
        </div>
      </div>
      <!-- Notifications Mute Toggle -->
      <div id="chat-menu-mute" style="padding:10px 16px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border-subtle);margin-top:4px;">
        <span id="chat-mute-label">🔔 Notifications</span>
        <span id="chat-mute-status" data-i18n="notificationsOn" style="font-size:12px;font-weight:600;color:var(--accent);">On</span>
      </div>
      <!-- Gruppen: Umbenennen (nur Admin, nur Gruppen) -->
      <div id="chat-menu-rename" style="display:none;padding:10px 16px;cursor:pointer;font-size:13px;border-top:1px solid var(--border-subtle);margin-top:4px;">
        <span data-i18n="renameGroupLabel">✏️ Rename group</span>
      </div>
      <!-- Gruppen: Mitglieder anzeigen (nur für Gruppen sichtbar) -->
      <div id="group-members-item" style="display:none;padding:8px 16px 4px;border-top:1px solid var(--border-subtle);margin-top:4px;">
        <div data-i18n="membersHeading" style="font-size:11px;font-weight:600;opacity:0.5;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em;">Members</div>
        <ul id="group-member-list" style="list-style:none;padding:0;margin:0;max-height:180px;overflow-y:auto;scrollbar-gutter:stable;"></ul>
      </div>
      <!-- Gruppen: Mitglied einladen -->
      <div id="group-invite-item" style="display:none;padding:4px 16px 10px;">
        <div style="display:flex;gap:6px;margin-top:6px;">
          <input id="group-invite-input" type="search" data-i18n-placeholder="invitePlaceholder" placeholder="Invite handle…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            style="flex:1;font-size:16px;padding:5px 8px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--bg-panel-alt);color:var(--text-primary);-webkit-appearance:none;" />
          <button id="group-invite-btn" data-i18n-title="inviteBtn" title="Invite"
            style="width:32px;height:32px;min-width:32px;border-radius:50%;background:var(--accent);color:#fff;font-size:18px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.15s,opacity 0.15s;padding:0;">＋</button>
        </div>
      </div>
      <!-- Einladungslink (DM + Gruppe, nur für eingeloggte User) -->
      <div id="chat-invite-item" style="display:none;border-top:1px solid var(--border-subtle);margin-top:4px;padding:10px 16px;cursor:pointer;font-size:13px;display:none;justify-content:space-between;align-items:center;" onclick="createInviteLink()">
        <span data-i18n="createInviteLinkLabel">🔗 Create invite link</span>
        <span id="chat-invite-status" style="font-size:11px;color:var(--accent-voice);"></span>
      </div>
      <!-- Gruppen: Verlassen -->
      <div id="group-leave-item" style="display:none;border-top:1px solid var(--border-subtle);margin-top:4px;padding:4px 16px 8px;">
        <button id="group-leave-btn" data-i18n="leaveGroupBtn" style="width:100%;font-size:13px;padding:7px 12px;border-radius:7px;background:transparent;border:1px solid var(--border-subtle);color:var(--status-error);cursor:pointer;text-align:left;">Verlassen</button>
      </div>
    </div>
  </div>
</div>

<div id="chat-header-spacer"></div>
<div id="messages"></div>

<div id="new-indicator">
  <span id="unread-count">0</span><span id="new-messages-suffix" data-i18n="newMessagesSuffix"> neue Nachrichten ↓</span>
</div>

<!-- ── INPUT-FOOTER (sticky) ───────────────────────────── -->
<div id="chat-input-footer">

<!-- Reply-Bar: erscheint wenn Nutzer auf ↩️ klickt -->
<div id="reply-bar">
  <span>↩️</span>
  <span class="reply-bar-preview">
    <span class="reply-bar-from" id="reply-bar-from"></span><span id="reply-bar-text"></span>
  </span>
  <button id="reply-bar-cancel" data-i18n-title="cancelTitle" title="Cancel">✕</button>
</div>

<!-- ── GAST-BANNER (wird per JS eingeblendet) ──────────────────────── -->
<div id="guest-banner" style="display:none;background:linear-gradient(135deg,rgba(56,189,248,0.12),rgba(99,102,241,0.12));border-top:1px solid rgba(56,189,248,0.2);padding:8px 16px;align-items:center;justify-content:space-between;gap:8px;font-size:12px;flex-shrink:0;">
  <div style="display:flex;align-items:center;gap:10px;min-width:0;">
    <span style="font-size:16px;flex-shrink:0;">👤</span>
    <div style="min-width:0;">
      <div id="guest-name-display" data-i18n="guestLabel" style="font-weight:600;color:var(--text-primary);">Guest</div>
      <div style="color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
        <span id="guest-timer-display">--h --m</span> <span data-i18n="timeRemaining">remaining</span> &nbsp;·&nbsp; <span id="guest-msgs-display">20</span> <span data-i18n="msgsRemaining">messages left</span>
      </div>
    </div>
  </div>
  <button id="guest-convert-btn" data-i18n="convertToPasskey" onclick="convertGuest()" style="flex-shrink:0;padding:6px 12px;border-radius:8px;border:none;background:var(--accent-voice);color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">
    Sign in with Passkey
  </button>
</div>

<!-- Attach-Bar -->
<div id="attach-bar" style="display:flex;align-items:center;gap:6px;padding:4px 12px 0;flex-shrink:0;">
  <button id="attach-photo-btn" data-i18n-title="photoTitle" title="Send photo" style="background:none;border:none;font-size:20px;cursor:pointer;padding:4px 6px;border-radius:8px;color:var(--text-secondary);line-height:1;transition:background 0.12s;">📷</button>
  <button id="attach-file-btn" data-i18n-title="fileTitle" title="Send file" style="background:none;border:none;font-size:20px;cursor:pointer;padding:4px 6px;border-radius:8px;color:var(--text-secondary);line-height:1;transition:background 0.12s;">📎</button>
  <button id="attach-gif-btn" data-i18n-title="gifTitle" title="Search GIF" style="background:none;border:none;font-size:12px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:8px;color:var(--text-secondary);line-height:1;border:1px solid var(--border-subtle);transition:background 0.12s;">GIF</button>
  <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" style="display:none" />
  <input id="file-input" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.ics,.gif,.txt" style="display:none" />
</div>

<textarea
  id="msg-input"
  placeholder="Nachricht…"
  data-i18n-placeholder="messagePlaceholder"
  rows="2"
  autofocus
></textarea>

<!-- 👇 DAS HINZUFÜGEN -->
<div id="length-warning"></div>

<button id="send-btn" data-i18n="sendBtn">Senden</button>

</div><!-- /#chat-input-footer -->

<!-- GIF-Suchmodal -->
<div id="gif-modal" style="display:none;position:fixed;inset:0;z-index:800;background:rgba(0,0,0,0.6);">
  <div style="position:absolute;bottom:0;left:0;right:0;background:var(--bg-panel);border-radius:16px 16px 0 0;padding:12px;max-height:80vh;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <input id="gif-search-input" type="search" data-i18n-placeholder="gifSearchPlaceholder" placeholder="Search GIF…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             style="flex:1;font-size:16px;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-panel-alt);color:var(--text-primary);outline:none;" />
      <button id="gif-modal-close" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-secondary);padding:4px 8px;">✕</button>
    </div>
    <div id="gif-results" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow-y:auto;flex:1;"></div>
    <div id="gif-loading" data-i18n="gifSearching" style="display:none;text-align:center;padding:20px;color:var(--text-secondary);font-size:13px;">Searching…</div>
  </div>
</div>

<div id="chat-toast-container" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(340px,92vw);"></div>

<script type="module" src="/js/chat.js"></script>
<script type="module">
  import { applyI18n } from "/js/i18n.js";
  applyI18n();
</script>

</body>
</html>
