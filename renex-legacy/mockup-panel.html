<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RENEX — Panel System Mockup</title>
  <style>
    :root {
      --bg-body:        #07070A;
      --bg-panel:       rgba(13,13,17,0.90);
      --bg-panel-alt:   #121218;
      --border-subtle:  #1C1C24;
      --border-panel:   rgba(255,255,255,0.06);
      --text-primary:   #E6E6EB;
      --text-secondary: #9A9AA3;
      --text-muted:     #6F6F78;
      --accent:         #38BDF8;
      --status-online:  #3CE47A;
      --status-idle:    #D97706;
      --status-offline: #3A3A45;
      --chat-self-bg:   #0C2030;
      --chat-self-border: rgba(56,189,248,0.22);
      --chat-peer-bg:   #1B1B28;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-body);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* subtle grid in the background — spatial feel */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(56,189,248,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* ── APP SHELL ─────────────────────────────────── */
    .app {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 920px;
      height: calc(100dvh - 32px);
      padding: 0 16px;
      position: relative;
    }

    /* ── PANEL ─────────────────────────────────────── */
    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 20px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 12px 48px rgba(0,0,0,0.5);
    }

    .panel-contacts {
      width: 270px;
      flex-shrink: 0;
    }

    .panel-chat {
      flex: 1;
      min-width: 0;
    }

    /* ── PANEL HEADER ──────────────────────────────── */
    .panel-header {
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      user-select: none;
      line-height: 1;
    }

    .brand .x {
      color: var(--accent);
      text-shadow:
        0 0 10px rgba(56,189,248,0.7),
        0 0 22px rgba(56,189,248,0.35);
    }

    .header-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg-panel-alt);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ── SEARCH ────────────────────────────────────── */
    .search-bar {
      padding: 10px 10px 6px;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      background: var(--bg-panel-alt);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      font-family: inherit;
    }

    .search-input::placeholder { color: var(--text-muted); }

    /* ── CONTACT LIST ──────────────────────────────── */
    .contact-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 10px;
      border-radius: 13px;
      cursor: pointer;
      transition: background 0.12s;
    }

    .contact-row:hover { background: rgba(255,255,255,0.04); }
    .contact-row.active { background: rgba(56,189,248,0.09); }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--bg-panel-alt);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      position: relative;
      flex-shrink: 0;
      user-select: none;
    }

    .status-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2px solid #0D0D11;
    }

    .status-dot.online  { background: var(--status-online); }
    .status-dot.idle    { background: var(--status-idle); }
    .status-dot.offline { background: var(--status-offline); }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .contact-preview {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .contact-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }

    .contact-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .unread-badge {
      background: var(--accent);
      color: #07070A;
      font-size: 10px;
      font-weight: 800;
      border-radius: 999px;
      min-width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    /* ── CHAT HEADER ───────────────────────────────── */
    .chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .back-btn {
      display: none;
      background: none;
      border: none;
      color: var(--accent);
      font-size: 20px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
    }

    .chat-peer-info { flex: 1; min-width: 0; }

    .chat-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .chat-status-label {
      font-size: 12px;
      margin-top: 1px;
    }

    .chat-status-label.online  { color: var(--status-online); }
    .chat-status-label.idle    { color: var(--status-idle); }
    .chat-status-label.offline { color: var(--text-muted); }

    /* ── MESSAGES ──────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
    }

    .bubble-wrap.self { align-items: flex-end; }
    .bubble-wrap.peer { align-items: flex-start; }

    .bubble {
      max-width: 72%;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }

    .bubble.self {
      background: var(--chat-self-bg);
      border: 1px solid var(--chat-self-border);
      border-radius: 16px 16px 4px 16px;
    }

    .bubble.peer {
      background: var(--chat-peer-bg);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px 16px 16px 4px;
    }

    .bubble-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
      padding: 0 4px;
    }

    /* ── EMPTY STATE ───────────────────────────────── */
    .empty-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-muted);
      user-select: none;
    }

    .empty-chat-icon {
      font-size: 48px;
      opacity: 0.2;
    }

    .empty-chat-hint {
      font-size: 13px;
      opacity: 0.5;
    }

    /* ── INPUT BAR ─────────────────────────────────── */
    .chat-input-bar {
      padding: 12px 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      background: var(--bg-panel-alt);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .chat-input:focus { border-color: rgba(56,189,248,0.35); }
    .chat-input::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #07070A;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
      line-height: 1;
    }

    .send-btn:hover { opacity: 0.85; }
    .send-btn:active { transform: scale(0.92); }

    /* ── SCROLLBAR ─────────────────────────────────── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }

    /* ── MOBILE ────────────────────────────────────── */
    @media (max-width: 640px) {
      .app {
        padding: 0;
        gap: 0;
        height: 100dvh;
      }

      .panel {
        border-radius: 0;
        border: none;
        box-shadow: none;
        position: absolute;
        inset: 0;
        width: 100%;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
      }

      .panel-contacts { transform: translateX(0); }
      .panel-chat     { transform: translateX(100%); }

      .app.chat-open .panel-contacts { transform: translateX(-100%); }
      .app.chat-open .panel-chat     { transform: translateX(0); }

      .back-btn { display: flex; }
    }

    /* ── LABEL MOCKUP ──────────────────────────────── */
    .mockup-label {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      opacity: 0.5;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="app" id="app">

  <!-- ═══════════════════════════════════════ -->
  <!-- PANEL 1 — Contacts                      -->
  <!-- ═══════════════════════════════════════ -->
  <div class="panel panel-contacts">

    <div class="panel-header">
      <div class="brand">RENE<span class="x">X</span></div>
      <div class="header-avatar">B</div>
    </div>

    <div class="search-bar">
      <input class="search-input" type="search" placeholder="Suchen…" autocomplete="off" />
    </div>

    <div class="contact-list">

      <div class="contact-row active" onclick="openChat(this, 'demo', 'online', 'D', 'hey was geht?')">
        <div class="avatar">D<span class="status-dot online"></span></div>
        <div class="contact-info">
          <div class="contact-name">demo</div>
          <div class="contact-preview">hey was geht?</div>
        </div>
        <div class="contact-meta">
          <div class="contact-time">09:42</div>
          <div class="unread-badge">2</div>
        </div>
      </div>

      <div class="contact-row" onclick="openChat(this, 'alice', 'offline', 'A', 'ok bis später')">
        <div class="avatar">A<span class="status-dot offline"></span></div>
        <div class="contact-info">
          <div class="contact-name">alice</div>
          <div class="contact-preview">ok bis später</div>
        </div>
        <div class="contact-meta">
          <div class="contact-time">gestern</div>
        </div>
      </div>

      <div class="contact-row" onclick="openChat(this, 'bob', 'idle', 'B', 'gg ez')">
        <div class="avatar">B<span class="status-dot idle"></span></div>
        <div class="contact-info">
          <div class="contact-name">bob</div>
          <div class="contact-preview">gg ez</div>
        </div>
        <div class="contact-meta">
          <div class="contact-time">Mo</div>
          <div class="unread-badge">1</div>
        </div>
      </div>

      <div class="contact-row" onclick="openChat(this, 'xray', 'online', 'X', 'ready?')">
        <div class="avatar">X<span class="status-dot online"></span></div>
        <div class="contact-info">
          <div class="contact-name">xray</div>
          <div class="contact-preview">ready?</div>
        </div>
        <div class="contact-meta">
          <div class="contact-time">09:38</div>
        </div>
      </div>

    </div>
  </div>

  <!-- ═══════════════════════════════════════ -->
  <!-- PANEL 2 — Chat                          -->
  <!-- ═══════════════════════════════════════ -->
  <div class="panel panel-chat">

    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()">‹</button>
      <div class="avatar" id="chat-avatar" style="width:36px;height:36px;font-size:13px;">
        D<span class="status-dot online"></span>
      </div>
      <div class="chat-peer-info">
        <div class="chat-title" id="chat-title">demo</div>
        <div class="chat-status-label online" id="chat-status-label">online</div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="bubble-wrap peer">
        <div class="bubble peer">hey was geht?</div>
        <div class="bubble-time">09:41</div>
      </div>
      <div class="bubble-wrap self">
        <div class="bubble self">alles gut, du?</div>
        <div class="bubble-time">09:42</div>
      </div>
      <div class="bubble-wrap peer">
        <div class="bubble peer">auch gut — ready für heute abend?</div>
        <div class="bubble-time">09:42</div>
      </div>
      <div class="bubble-wrap self">
        <div class="bubble self">ja bin dabei 🎮</div>
        <div class="bubble-time">09:43</div>
      </div>
    </div>

    <div class="chat-input-bar">
      <input class="chat-input" id="chat-input" type="text" placeholder="Nachricht…" autocomplete="off" />
      <button class="send-btn" onclick="sendMessage()">↑</button>
    </div>

  </div>

</div>

<div class="mockup-label">RENEX — Panel System Mockup · noch nicht deployed</div>

<script>
  const app = document.getElementById('app');

  function openChat(row, name, status, initial, preview) {
    // active state
    document.querySelectorAll('.contact-row').forEach(r => r.classList.remove('active'));
    row.classList.add('active');

    // update chat header
    const avatar = document.getElementById('chat-avatar');
    avatar.childNodes[0].textContent = initial;
    const dot = avatar.querySelector('.status-dot');
    dot.className = 'status-dot ' + status;

    document.getElementById('chat-title').textContent = name;

    const label = document.getElementById('chat-status-label');
    label.className = 'chat-status-label ' + status;
    label.textContent = status === 'online' ? 'online' : status === 'idle' ? 'abwesend' : 'offline';

    // mobile: slide
    app.classList.add('chat-open');

    document.getElementById('chat-input').focus();
  }

  function closeChat() {
    app.classList.remove('chat-open');
  }

  function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    const messages = document.getElementById('messages');
    const now = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap self';
    wrap.innerHTML = `<div class="bubble self">${text}</div><div class="bubble-time">${now}</div>`;
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;

    input.value = '';
    input.focus();
  }

  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
</script>

</body>
</html>
