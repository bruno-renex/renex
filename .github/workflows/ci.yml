name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vitest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 ist EOL (04/2026) und kennt node:sqlite nicht (cronRetentionCap-Test).
        node: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  spec-check:
    name: Spec Sanity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify required spec docs exist
        run: |
          # MULTI_DEVICE/GROUPS_MULTIDEVICE: seit Doku-Archivierung 2026-07-12 unter docs/archive/
          # VISION.md bewusst NICHT gelistet: seit 2026-07-26 intern (gitignored)
          for f in docs/MANIFESTO.md docs/PROTOCOL.md \
                   docs/archive/MULTI_DEVICE.md docs/RECOVERY.md docs/archive/GROUPS_MULTIDEVICE.md \
                   docs/THREAT_MODEL.md \
                   docs/CONTRIBUTING.md docs/CHANGELOG.md \
                   LICENSE LICENSE-MIT LICENSE-APACHE LICENSE-AGPL \
                   README.md SECURITY.md; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              exit 1
            fi
          done
          echo "All required docs and license files present."
